<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">AxéCloud — refinamento do Atabaque de Dados</title>
  <desc id="desc">Apresentação vetorial do símbolo AxéCloud com silhueta de atabaque, camadas e uma conexão de dados.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0E1512" flood-opacity=".14"/></filter>
    <g id="mark">
      <path d="M16.5 15.5c1 13.8 3.1 28.8 7.3 38.1 5.2 2.8 11.2 2.8 16.4 0 4.2-9.3 6.3-24.3 7.3-38.1Z" fill="#17251D"/>
      <path d="M18.5 28.6c8.6 3.7 18.4 3.7 27 0M20.7 41.8c7.2 3.1 15.4 3.1 22.6 0" fill="none" stroke="#4B6555" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22.5 24.2c6.2 1.8 7.2 6.4 9.1 10.1 1.7 3.3 4 6.3 9.4 7.9" fill="none" stroke="#F7C928" stroke-width="2.2" stroke-linecap="round"/>
      <g fill="#F7C928"><circle cx="22.5" cy="24.2" r="2.3"/><circle cx="31.6" cy="34.3" r="2.3"/><circle cx="41" cy="42.2" r="2.3"/></g>
      <ellipse cx="32" cy="15.2" rx="17.4" ry="6.8" fill="#F7C928"/><ellipse cx="32" cy="15.2" rx="11.5" ry="3.5" fill="#17251D" opacity=".13"/>
      <path d="M25.2 53.8c4.5 1.9 9.1 1.9 13.6 0" fill="none" stroke="#F7C928" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1536" height="1024" fill="#F7F2E8"/>
  <text x="96" y="88" fill="#A58100" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="4">AXÉCLOUD · REFINAMENTO 04</text>
  <text x="96" y="142" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="38" font-weight="800">Mais símbolo. Menos ilustração.</text>
  <text x="96" y="178" fill="#667269" font-family="Outfit, Arial, sans-serif" font-size="17">A presença do atabaque foi preservada; cordas e ornamentos deixaram de competir com a marca.</text>
  <g filter="url(#shadow)"><rect x="96" y="232" width="1344" height="420" rx="36" fill="#FFFDF9" stroke="#DED7C9"/></g>
  <g transform="translate(176 310) scale(4.25)"><use href="#mark"/></g>
  <text x="516" y="414" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4.6">AxéCloud</text>
  <text x="524" y="474" fill="#667269" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="6.6">GESTÃO PARA TERREIROS</text>
  <line x1="516" y1="520" x2="1190" y2="520" stroke="#E3DCCE"/>
  <text x="516" y="558" fill="#829087" font-family="Outfit, Arial, sans-serif" font-size="14">ATABAQUE · CAMADAS DA CASA · FLUXO CONECTADO</text>
  <rect x="96" y="712" width="460" height="214" rx="30" fill="#17251D"/>
  <g transform="translate(142 744) scale(2.25)"><use href="#mark"/></g>
  <text x="312" y="802" fill="#F7F2E8" font-family="Outfit, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.6">AxéCloud</text>
  <text x="315" y="838" fill="#C6D0C8" font-family="Outfit, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">GESTÃO PARA TERREIROS</text>
  <text x="312" y="886" fill="#8FA096" font-family="Outfit, Arial, sans-serif" font-size="13">APLICAÇÃO EM INTERFACE ESCURA</text>
  <rect x="596" y="712" width="844" height="214" rx="30" fill="#FFFDF9" stroke="#DED7C9"/>
  <text x="636" y="760" fill="#A58100" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="3">O QUE MUDOU</text>
  <text x="636" y="806" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="700">01</text><text x="680" y="806" fill="#667269" font-family="Outfit, Arial, sans-serif" font-size="16">Removemos o X de cordas.</text>
  <text x="636" y="846" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="700">02</text><text x="680" y="846" fill="#667269" font-family="Outfit, Arial, sans-serif" font-size="16">As camadas ficaram discretas e estruturais.</text>
  <text x="636" y="886" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="20" font-weight="700">03</text><text x="680" y="886" fill="#667269" font-family="Outfit, Arial, sans-serif" font-size="16">Uma única rota representa o fluxo da gestão.</text>
  <text x="1440" y="976" text-anchor="end" fill="#17251D" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="700">PROPOSTA NÃO APLICADA AO SISTEMA</text>
</svg>
