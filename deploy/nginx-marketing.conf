map $http_accept $wants_markdown {
    default 0;
    ~*text/markdown 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/markdown image/svg+xml;
    gzip_min_length 256;

    error_page 418 = @markdown;

    # Servir /rota/index.html sem 301 para barra final (evita loop com Caddy)
    absolute_redirect off;

    # Typo comum no Search Console: sitemap.xm → sitemap.xml
    location = /sitemap.xm {
        return 301 /sitemap.xml;
    }

    location /api/ {
        return 404;
    }

    location /m-assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /screenshots/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Resumo leve no caminho crítico; permite cache na CDN com revalidação em segundo plano.
    location = /diretorio-cidades.json {
        expires 10m;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Snapshot completo só é solicitado perto do mapa e pode permanecer mais tempo na borda.
    location = /diretorio-snapshot.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Payload geográfico compacto: abre o mapa sem baixar os dados completos dos cards.
    location = /terreiros/mapa.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Perfil público dinâmico no visual cinematográfico. O slug é lido no navegador;
    # crawlers continuam recebendo o HTML SEO renderizado pela API no proxy externo.
    location ~ ^/terreiro/[^/]+/?$ {
        if ($wants_markdown) {
            return 418;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Accept" always;
        try_files /terreiro/index.html =404;
    }

    # Emissão pública de senhas de visitante (token no path; lógica no browser).
    location ~ ^/senhas/[^/]+/?$ {
        if ($wants_markdown) {
            return 418;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Accept" always;
        try_files /senhas/index.html =404;
    }

    # Detalhe público do evento (token no path).
    location ~ ^/evento/[^/]+/?$ {
        if ($wants_markdown) {
            return 418;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Accept" always;
        try_files /evento/index.html =404;
    }

    # Cidades do diretório antigo (/terreiros/uf/cidade) → diretório cinematográfico.
    # Aspas obrigatórias: nginx trata {2} como bloco se o regex não estiver entre aspas.
    location ~ "^/terreiros/([A-Za-z]{2})/([^/]+)/?$" {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /terreiros?uf=$1&cidade=$2;
    }

    # Formato legado /terreiros/cidade/:slug → diretório cinematográfico.
    location ~ ^/terreiros/cidade/([^/]+)/?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /terreiros?cidade=$1;
    }

    # Formato legado /terreiros/:slug (perfil) → /terreiro/:slug.
    # Exclui arquivos com ponto (ex.: mapa.json) via [^/.]+.
    location ~ ^/terreiros/([^/.]+)/?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /terreiro/$1;
    }

    # Glossário canônico em /conteudo/glossario (React). Query legada redireciona.
    location = /conteudo {
        if ($arg_aba = "glossario") {
            return 301 /conteudo/glossario;
        }
        if ($wants_markdown) {
            return 418;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Accept" always;
        try_files /conteudo/index.html =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        if ($wants_markdown) {
            return 418;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Accept" always;
        # index.html da pasta ANTES de $uri — evita 301 para barra final (loop com Caddy)
        # O shell React preserva rotas públicas dinâmicas que ainda não foram pré-renderizadas.
        try_files $uri/index.html $uri /__react_shell.html;
    }

    location @markdown {
        internal;
        charset utf-8;
        default_type "text/markdown; charset=utf-8";
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header Content-Signal "search=yes, ai-input=yes, ai-train=no" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri/index.md $uri.md /index.md =406;
    }

    location = /__react_shell.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
